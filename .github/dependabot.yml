# Monthly version updates, one grouped PR for minor/patch per ecosystem,
# majors as separate PRs. Security updates arrive independently and immediately.
# Merging a PR into master triggers "Build and Deploy", so merge = live.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels: [dependencies]
    assignees: [silasmahler]
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "08:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels: [dependencies]
    assignees: [silasmahler]
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        update-types: [minor, patch]
